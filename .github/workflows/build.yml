name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (Blazor Server + shared libraries)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      PROJECT: Razors/AccountERP.Web/AccountERP.Web/AccountERP.Web.csproj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # The hosted Windows image ships the wasm-tools workload, which turns on the WebAssembly
      # native relink for the Client project. That relink compiles a P/Invoke table with clang and
      # fails on Pkcs11Interop's overloaded native signatures. The app does not need a native
      # WebAssembly build, so CI builds the same way a developer machine without wasm-tools does.
      - name: Restore
        run: dotnet restore ${{ env.PROJECT }} -p:WasmBuildNative=false

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --no-restore --configuration Debug -p:WasmBuildNative=false
